<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MYFLIX — Koleksi Tontonanku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0d;
    --bg-elev: #141417;
    --bg-card: #1d1d22;
    --bg-card-hover: #27272e;
    --text: #f3f2ee;
    --text-dim: #9b9ba3;
    --text-faint: #66666e;
    --accent: #e0293e;
    --accent-hover: #ff3b52;
    --accent-dim: #7a1620;
    --border: #2a2a30;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] {
    --bg: #0a0a0d; --bg-elev: #141417; --bg-card: #1d1d22; --bg-card-hover: #27272e;
    --text: #f3f2ee; --text-dim: #9b9ba3; --text-faint: #66666e;
    --accent: #e0293e; --accent-hover: #ff3b52; --accent-dim: #7a1620; --border: #2a2a30;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .display {
    font-family: 'Bebas Neue', 'Inter', sans-serif;
    letter-spacing: 0.03em;
  }

  /* ---------- NAV ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 40;
    padding-top: env(safe-area-inset-top, 0px);
    background: linear-gradient(to bottom, rgba(10,10,13,0.95) 0%, rgba(10,10,13,0.75) 70%, transparent 100%);
    backdrop-filter: blur(6px);
  }
  .nav-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .logo {
    font-size: 28px;
    color: var(--accent);
    flex-shrink: 0;
    cursor: default;
  }
  .nav-search {
    flex: 1;
    max-width: 340px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    transition: border-color 0.15s ease;
  }
  .nav-search:focus-within { border-color: var(--text-dim); }
  .nav-search svg { flex-shrink: 0; opacity: 0.6; }
  .nav-search input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    width: 100%;
  }
  .nav-search input::placeholder { color: var(--text-faint); }
  .btn-add {
    margin-left: auto;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn-add:hover { background: var(--accent-hover); }
  .btn-add:active { transform: scale(0.97); }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    min-height: 62vh;
    display: flex;
    align-items: flex-end;
    padding: 0 24px 56px;
    margin-bottom: 8px;
    background-size: cover;
    background-position: center 28%;
    background-color: var(--bg-elev);
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, var(--bg) 2%, rgba(10,10,13,0.25) 45%, rgba(10,10,13,0.05) 70%),
      linear-gradient(to right, rgba(10,10,13,0.75) 0%, rgba(10,10,13,0.1) 55%);
  }
  .hero-content { position: relative; max-width: 620px; }
  .hero-tag {
    display: inline-block;
    color: var(--accent-hover);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .hero-title {
    font-size: clamp(38px, 7vw, 72px);
    line-height: 0.98;
    margin: 0 0 14px;
  }
  .hero-desc {
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.55;
    margin: 0 0 22px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hero-actions { display: flex; gap: 12px; }
  .btn {
    font-family: inherit;
    font-weight: 600;
    font-size: 14.5px;
    border-radius: 6px;
    padding: 11px 22px;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #fff; color: #111; }
  .btn-primary:hover { background: #e2e2e2; }
  .btn-ghost { background: rgba(120,120,130,0.35); color: var(--text); }
  .btn-ghost:hover { background: rgba(120,120,130,0.5); }

  /* Empty hero */
  .hero-empty {
    min-height: 46vh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 0 24px 40px;
    background: radial-gradient(ellipse at 30% 20%, rgba(224,41,62,0.16), transparent 60%), var(--bg);
  }
  .hero-empty .hero-title { max-width: 640px; }

  /* ---------- ROWS ---------- */
  .rows { padding: 0 0 60px; }
  .row { margin-bottom: 34px; }
  .row-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 24px;
    margin-bottom: 10px;
    max-width: 1400px;
    margin-left: auto;
    margin-right: auto;
  }
  .row-title { font-size: 20px; font-weight: 700; margin: 0; }
  .row-count { color: var(--text-faint); font-size: 13px; }
  .row-track {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding: 4px 24px 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .row-track::-webkit-scrollbar { height: 6px; }
  .row-track::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .card {
    position: relative;
    flex: 0 0 auto;
    width: 190px;
    aspect-ratio: 2 / 3;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-card);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, z-index 0s;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card:hover {
    transform: scale(1.08);
    z-index: 5;
    box-shadow: 0 14px 34px rgba(0,0,0,0.55);
  }
  .card-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 54px;
    color: rgba(255,255,255,0.85);
  }
  .card-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.15) 55%, transparent 75%);
    opacity: 0;
    transition: opacity 0.18s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px;
  }
  .card:hover .card-overlay { opacity: 1; }
  .card-overlay-title { font-size: 13px; font-weight: 600; line-height: 1.25; margin: 0 0 2px; }
  .card-overlay-cat { font-size: 11px; color: var(--text-dim); margin: 0; }
  .card-del {
    position: absolute;
    top: 8px; right: 8px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.15s ease, background 0.15s ease;
    cursor: pointer;
  }
  .card:hover .card-del { opacity: 1; }
  .card-del:hover { background: var(--accent); }
  .card-del.confirming { opacity: 1; background: var(--accent); width: auto; padding: 0 10px; border-radius: 13px; font-size: 11px; font-weight: 600; }

  /* ---------- EMPTY STATE (no items at all) ---------- */
  .empty-state {
    max-width: 480px;
    margin: 40px auto 100px;
    text-align: center;
    padding: 0 24px;
  }
  .empty-state h2 { font-size: 22px; margin-bottom: 8px; }
  .empty-state p { color: var(--text-dim); font-size: 14.5px; line-height: 1.6; margin-bottom: 22px; }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 100;
    overscroll-behavior: contain;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 22px;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head h3 { margin: 0; font-size: 18px; }
  .modal-close {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; padding: 4px; border-radius: 6px; line-height: 0;
  }
  .modal-close:hover { color: var(--text); background: rgba(255,255,255,0.08); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
  .field input[type="text"], .field textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 11px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input[type="text"]:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 64px; }

  .upload-zone {
    border: 1.5px dashed var(--border);
    border-radius: 9px;
    aspect-ratio: 2/3;
    max-width: 150px;
    margin: 0 auto 6px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    color: var(--text-faint);
    text-align: center;
    padding: 10px;
    transition: border-color 0.15s ease, color 0.15s ease;
    overflow: hidden;
    position: relative;
  }
  .upload-zone:hover { border-color: var(--text-dim); color: var(--text-dim); }
  .upload-zone.has-image { border-style: solid; }
  .upload-zone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .upload-zone span { font-size: 12px; line-height: 1.4; }
  .upload-zone input[type="file"] { display: none; }

  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; justify-content: center; }
  .form-error { color: var(--accent-hover); font-size: 12.5px; margin: -6px 0 12px; min-height: 1em; }

  .detail-modal { max-width: 480px; padding: 0; overflow: hidden; }
  .detail-img-wrap { width: 100%; aspect-ratio: 16/9; background: var(--bg-card); position: relative; }
  .detail-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-close {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.55); border: none; color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .detail-body { padding: 20px 22px 22px; }
  .detail-cat {
    display: inline-block;
    background: rgba(224,41,62,0.18);
    color: var(--accent-hover);
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 9px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .detail-title { font-size: 24px; margin: 0 0 10px; }
  .detail-desc { color: var(--text-dim); font-size: 14.5px; line-height: 1.6; margin: 0 0 18px; white-space: pre-wrap; }
  .detail-meta { color: var(--text-faint); font-size: 12.5px; margin: 0 0 18px; }
  .btn-danger { background: transparent; border: 1px solid var(--accent-dim); color: var(--accent-hover); width: 100%; justify-content: center; }
  .btn-danger:hover { background: rgba(224,41,62,0.12); }
  .btn-danger.confirming { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- TOAST ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: #232328;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13.5px;
    padding: 11px 18px;
    border-radius: 8px;
    z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .toast[hidden] { display: none; }

  .banner {
    max-width: 1400px; margin: 0 auto; padding: 10px 24px 0;
    color: var(--text-faint); font-size: 12.5px;
  }

  @media (max-width: 640px) {
    .card { width: 128px; }
    .logo { font-size: 22px; }
    .nav-search { display: none; }
    .hero { min-height: 52vh; padding-bottom: 36px; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <span class="logo display">MYFLIX</span>
    <div class="nav-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Cari judul...">
    </div>
    <button class="btn-add" id="openAddBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Tambah
    </button>
  </div>
</header>

<main id="main">
  <div id="heroSlot"></div>
  <div class="rows" id="rowsSlot"></div>
  <div class="empty-state" id="emptyState" hidden>
    <h2 class="display" style="font-size:26px;">Koleksimu masih kosong</h2>
    <p>Tambahkan foto, judul, dan kategori favoritmu sendiri. Semua tersimpan otomatis, tampil seperti Netflix.</p>
    <button class="btn btn-primary" id="emptyAddBtn" style="margin:0 auto;">+ Tambah judul pertama</button>
  </div>
</main>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addOverlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 class="display" style="font-size:20px;">Tambah Judul</h3>
      <button class="modal-close" id="addCloseBtn" aria-label="Tutup">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="addForm">
      <div class="field">
        <label>Poster / Foto</label>
        <div class="upload-zone" id="uploadZone">
          <svg id="uploadIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span id="uploadLabel">Klik untuk pilih foto</span>
          <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif">
        </div>
      </div>
      <div class="field">
        <label for="titleInput">Judul</label>
        <input type="text" id="titleInput" placeholder="mis. Perjalanan ke Bromo" maxlength="80">
      </div>
      <div class="field">
        <label for="categoryInput">Kategori / Baris</label>
        <input type="text" id="categoryInput" list="categoryList" placeholder="mis. Favorit Saya" maxlength="40">
        <datalist id="categoryList"></datalist>
      </div>
      <div class="field">
        <label for="descInput">Deskripsi (opsional)</label>
        <textarea id="descInput" placeholder="Cerita singkat tentang foto ini..." maxlength="400"></textarea>
      </div>
      <div class="form-error" id="formError"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="addCancelBtn">Batal</button>
        <button type="submit" class="btn btn-primary" id="addSubmitBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailOverlay" hidden>
  <div class="modal detail-modal" id="detailModal"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
  "use strict";

  // ---------- state ----------
  var STORAGE_KEY = "myflix_items_v1";
  var items = [];              // {id, title, category, description, dataUrl, createdAt}
  var storageOk = true;        // whether localStorage is actually usable
  var pendingFile = null;      // File selected in add form
  var pendingPreview = null;   // compressed dataURL for preview / storage
  var searchTerm = "";

  // ---------- utils ----------
  function el(id){ return document.getElementById(id); }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function showToast(msg, ms){
    var t = el("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.hidden = true; }, ms || 2600);
  }
  function hueFromString(s){
    var h = 0;
    for (var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) % 360; }
    return h;
  }
  function fallbackStyle(title){
    var h = hueFromString(title || "?");
    return "background: linear-gradient(155deg, hsl(" + h + ",55%,22%), hsl(" + ((h+40)%360) + ",50%,12%));";
  }
  function initials(title){
    if (!title) return "?";
    var parts = title.trim().split(/\s+/).slice(0,2);
    return parts.map(function(p){ return p[0]; }).join("").toUpperCase();
  }
  function imgSrc(item){
    return item.dataUrl || null;
  }
  function fmtDate(ts){
    try {
      return new Date(ts).toLocaleDateString("id-ID", { day:"numeric", month:"long", year:"numeric" });
    } catch(e){ return ""; }
  }

  // Compress an image file into a small JPEG dataURL (used for preview,
  // and as the storage fallback when the assets capability is unavailable).
  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL("image/jpeg", quality || 0.82));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("Gagal membaca gambar")); };
      img.src = url;
    });
  }
  function compressUnderLimit(file){
    // Try progressively smaller/lower-quality renders until reasonably small
    // (keeps localStorage usage sane across many photos).
    var attempts = [[900,0.85],[720,0.8],[560,0.72],[420,0.65]];
    var i = 0;
    function tryNext(){
      var a = attempts[i];
      return compressImage(file, a[0], a[1]).then(function(dataUrl){
        if (dataUrl.length < 700000 || i === attempts.length - 1) return dataUrl;
        i++;
        return tryNext();
      });
    }
    return tryNext();
  }

  // ---------- local storage (static site, no backend) ----------
  function loadItems(){
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(items)) items = [];
    } catch(e){
      console.error("localStorage read failed", e);
      storageOk = false;
      items = [];
    }
  }
  function saveItems(){
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      return true;
    } catch(e){
      console.error("localStorage write failed", e);
      storageOk = false;
      showToast("Penyimpanan browser penuh atau tidak tersedia. Coba hapus beberapa foto atau gunakan foto berukuran lebih kecil.", 4500);
      return false;
    }
  }
  function initStorage(){
    loadItems();
    items.sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
    renderAll();
    if (!storageOk) {
      showToast("Browser ini tidak mendukung penyimpanan lokal, perubahan tidak akan tersimpan", 4200);
    }
  }

  // ---------- render ----------
  function groupByCategory(list){
    var order = [];
    var map = {};
    list.forEach(function(item){
      var cat = item.category || "Favorit Saya";
      if (!map[cat]) { map[cat] = []; order.push(cat); }
      map[cat].push(item);
    });
    return order.map(function(cat){ return { category: cat, items: map[cat] }; });
  }

  function renderAll(){
    var filtered = searchTerm
      ? items.filter(function(it){ return it.title.toLowerCase().indexOf(searchTerm) !== -1; })
      : items;

    el("emptyState").hidden = items.length > 0;
    renderHero(filtered);
    renderRows(filtered);
  }

  function renderHero(list){
    var slot = el("heroSlot");
    if (items.length === 0) {
      slot.innerHTML =
        '<section class="hero-empty">' +
          '<span class="hero-tag">Koleksi pribadimu</span>' +
          '<h1 class="hero-title display">Simpan momen favoritmu,<br>tampil ala layar lebar</h1>' +
          '<p class="hero-desc" style="max-width:520px;">Unggah foto, beri judul dan kategori sesuka hati. Setiap tambahan langsung muncul di jajaran di bawah.</p>' +
          '<div class="hero-actions"><button class="btn btn-primary" id="heroAddBtn">+ Tambah judul pertama</button></div>' +
        '</section>';
      var b = el("heroAddBtn");
      if (b) b.addEventListener("click", openAddModal);
      return;
    }
    if (list.length === 0) {
      slot.innerHTML = "";
      return;
    }
    var hero = list[0];
    var src = imgSrc(hero);
    var style = src ? ('background-image:url(' + JSON.stringify(src) + ');') : fallbackStyle(hero.title);
    slot.innerHTML =
      '<section class="hero" style="' + style + '">' +
        '<div class="hero-content">' +
          '<span class="hero-tag">' + escapeHtml(hero.category) + '</span>' +
          '<h1 class="hero-title display">' + escapeHtml(hero.title) + '</h1>' +
          (hero.description ? '<p class="hero-desc">' + escapeHtml(hero.description) + '</p>' : '') +
          '<div class="hero-actions">' +
            '<button class="btn btn-primary" id="heroDetailBtn">&#9654; Lihat Detail</button>' +
            '<button class="btn btn-ghost" id="heroAddBtn2">+ Tambah Baru</button>' +
          '</div>' +
        '</div>' +
      '</section>';
    el("heroDetailBtn").addEventListener("click", function(){ openDetail(hero.id); });
    el("heroAddBtn2").addEventListener("click", openAddModal);
  }

  function cardHtml(item){
    var src = imgSrc(item);
    var inner = src
      ? '<img src="' + src + '" alt="' + escapeHtml(item.title) + '" loading="lazy">'
      : '<div class="card-fallback" style="' + fallbackStyle(item.title) + '">' + escapeHtml(initials(item.title)) + '</div>';
    return (
      '<div class="card" data-id="' + item.id + '" tabindex="0" role="button" aria-label="' + escapeHtml(item.title) + '">' +
        inner +
        '<div class="card-del" data-del="' + item.id + '" aria-label="Hapus">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
        '</div>' +
        '<div class="card-overlay">' +
          '<p class="card-overlay-title">' + escapeHtml(item.title) + '</p>' +
          '<p class="card-overlay-cat">' + escapeHtml(item.category) + '</p>' +
        '</div>' +
      '</div>'
    );
  }

  function renderRows(list){
    var slot = el("rowsSlot");
    if (list.length === 0) {
      slot.innerHTML = (items.length > 0 && searchTerm)
        ? '<p style="text-align:center;color:var(--text-faint);padding:40px 24px;">Tidak ada judul yang cocok dengan "' + escapeHtml(searchTerm) + '"</p>'
        : "";
      return;
    }
    var groups = groupByCategory(list);
    slot.innerHTML = groups.map(function(g){
      return (
        '<div class="row">' +
          '<div class="row-head">' +
            '<h2 class="row-title">' + escapeHtml(g.category) + '</h2>' +
            '<span class="row-count">' + g.items.length + ' judul</span>' +
          '</div>' +
          '<div class="row-track" data-track>' +
            g.items.map(cardHtml).join("") +
          '</div>' +
        '</div>'
      );
    }).join("");

    // card click -> detail
    slot.querySelectorAll(".card").forEach(function(cardEl){
      cardEl.addEventListener("click", function(e){
        if (e.target.closest("[data-del]")) return;
        openDetail(cardEl.getAttribute("data-id"));
      });
      cardEl.addEventListener("keydown", function(e){
        if (e.key === "Enter") openDetail(cardEl.getAttribute("data-id"));
      });
    });
    // delete button (two-step confirm)
    slot.querySelectorAll("[data-del]").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        if (btn.classList.contains("confirming")) {
          deleteItem(btn.getAttribute("data-del"));
        } else {
          btn.classList.add("confirming");
          btn.innerHTML = "Hapus?";
          setTimeout(function(){
            btn.classList.remove("confirming");
            btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
          }, 2600);
        }
      });
    });
    // wheel -> horizontal scroll for rows on desktop
    slot.querySelectorAll("[data-track]").forEach(function(track){
      track.addEventListener("wheel", function(e){
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          track.scrollLeft += e.deltaY;
          e.preventDefault();
        }
      }, { passive: false });
    });
  }

  // ---------- detail modal ----------
  function openDetail(id){
    var item = items.filter(function(it){ return it.id === id; })[0];
    if (!item) return;
    var src = imgSrc(item);
    var modal = el("detailModal");
    modal.innerHTML =
      '<div class="detail-img-wrap" style="' + (src ? '' : fallbackStyle(item.title)) + '">' +
        (src ? '<img src="' + src + '" alt="' + escapeHtml(item.title) + '">' : '<div class="card-fallback" style="width:100%;height:100%;">' + escapeHtml(initials(item.title)) + '</div>') +
        '<button class="detail-close" id="detailCloseBtn" aria-label="Tutup"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
      '</div>' +
      '<div class="detail-body">' +
        '<span class="detail-cat">' + escapeHtml(item.category) + '</span>' +
        '<h2 class="detail-title display">' + escapeHtml(item.title) + '</h2>' +
        (item.description ? '<p class="detail-desc">' + escapeHtml(item.description) + '</p>' : '<p class="detail-desc" style="opacity:0.6;">Belum ada deskripsi.</p>') +
        (item.createdAt ? '<p class="detail-meta">Ditambahkan ' + fmtDate(item.createdAt) + '</p>' : '') +
        '<button class="btn btn-danger" id="detailDeleteBtn">Hapus dari koleksi</button>' +
      '</div>';
    el("detailOverlay").hidden = false;
    el("detailCloseBtn").addEventListener("click", closeDetail);
    var delBtn = el("detailDeleteBtn");
    delBtn.addEventListener("click", function(){
      if (delBtn.classList.contains("confirming")) {
        deleteItem(item.id);
        closeDetail();
      } else {
        delBtn.classList.add("confirming");
        delBtn.textContent = "Yakin hapus? Klik sekali lagi";
      }
    });
  }
  function closeDetail(){ el("detailOverlay").hidden = true; }

  // ---------- delete ----------
  function deleteItem(id){
    items = items.filter(function(it){ return it.id !== id; });
    saveItems();
    renderAll();
    showToast("Dihapus dari koleksi");
  }

  // ---------- add modal ----------
  function openAddModal(){
    el("addForm").reset();
    pendingFile = null;
    pendingPreview = null;
    el("uploadZone").classList.remove("has-image");
    el("uploadZone").innerHTML =
      '<svg id="uploadIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>' +
      '<span id="uploadLabel">Klik untuk pilih foto</span>' +
      '<input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif">';
    bindFileInput();
    el("formError").textContent = "";
    refreshCategoryList();
    el("addOverlay").hidden = false;
    setTimeout(function(){ el("titleInput").focus(); }, 50);
  }
  function closeAddModal(){ el("addOverlay").hidden = true; }

  function refreshCategoryList(){
    var seen = {};
    var cats = [];
    items.forEach(function(it){
      if (!seen[it.category]) { seen[it.category] = true; cats.push(it.category); }
    });
    el("categoryList").innerHTML = cats.map(function(c){ return '<option value="' + escapeHtml(c) + '">'; }).join("");
  }

  function bindFileInput(){
    var zone = el("uploadZone");
    zone.addEventListener("click", function(){ el("fileInput").click(); });
    el("fileInput").addEventListener("change", async function(e){
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!/^image\//.test(file.type)) {
        el("formError").textContent = "Berkas harus berupa gambar.";
        return;
      }
      pendingFile = file;
      el("formError").textContent = "";
      try {
        var preview = await compressImage(file, 500, 0.8);
        pendingPreview = preview;
        zone.classList.add("has-image");
        zone.innerHTML = '<img src="' + preview + '" alt="pratinjau">' +
          '<input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" style="position:absolute;inset:0;opacity:0;cursor:pointer;">';
        // rebind so a second click can change the photo
        el("fileInput").addEventListener("change", async function(ev){
          var f2 = ev.target.files && ev.target.files[0];
          if (!f2) return;
          if (!/^image\//.test(f2.type)) { el("formError").textContent = "Berkas harus berupa gambar."; return; }
          pendingFile = f2;
          pendingPreview = await compressImage(f2, 500, 0.8);
          zone.querySelector("img").src = pendingPreview;
        });
      } catch(err){
        console.error(err);
        el("formError").textContent = "Gagal membaca foto, coba foto lain.";
      }
    });
  }

  async function handleAddSubmit(e){
    e.preventDefault();
    var title = el("titleInput").value.trim();
    var category = el("categoryInput").value.trim() || "Favorit Saya";
    var description = el("descInput").value.trim();
    var errEl = el("formError");
    errEl.textContent = "";

    if (!title) { errEl.textContent = "Judul wajib diisi."; el("titleInput").focus(); return; }
    if (!pendingFile) { errEl.textContent = "Pilih foto terlebih dahulu."; return; }

    var submitBtn = el("addSubmitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Menyimpan...";

    try {
      var dataUrl = pendingPreview || await compressUnderLimit(pendingFile);
      var doc = {
        id: "item_" + Date.now() + "_" + Math.random().toString(36).slice(2,8),
        title: title,
        category: category,
        description: description,
        dataUrl: dataUrl,
        createdAt: Date.now()
      };

      items.unshift(doc);
      var ok = saveItems();
      if (!ok) {
        items.shift(); // roll back if it didn't fit in storage
        errEl.textContent = "Penyimpanan browser penuh. Hapus beberapa foto lama lalu coba lagi.";
        return;
      }
      renderAll();
      showToast("Judul \"" + title + "\" ditambahkan");
      closeAddModal();
    } catch(err){
      console.error(err);
      errEl.textContent = "Gagal menyimpan. Coba lagi.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Simpan";
    }
  }

  // ---------- search ----------
  var searchTimer = null;
  function onSearchInput(e){
    clearTimeout(searchTimer);
    var val = e.target.value;
    searchTimer = setTimeout(function(){
      searchTerm = val.trim().toLowerCase();
      renderAll();
    }, 180);
  }

  // ---------- wire up static controls ----------
  el("openAddBtn").addEventListener("click", openAddModal);
  el("emptyAddBtn").addEventListener("click", openAddModal);
  el("addCloseBtn").addEventListener("click", closeAddModal);
  el("addCancelBtn").addEventListener("click", closeAddModal);
  el("addOverlay").addEventListener("click", function(e){ if (e.target === el("addOverlay")) closeAddModal(); });
  el("detailOverlay").addEventListener("click", function(e){ if (e.target === el("detailOverlay")) closeDetail(); });
  el("addForm").addEventListener("submit", handleAddSubmit);
  el("searchInput").addEventListener("input", onSearchInput);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") { closeAddModal(); closeDetail(); }
  });
  bindFileInput();

  initStorage();
})();
</script>
</body>
</html>
